# Knowledge-resource sources, grouped by topic (mirrors the HW2 handout list).
#
# type:
#   crawl      BFS over HTML (+ linked PDFs) from `seeds`
#   files      download exact URLs (PDFs)
#   wikipedia  MediaWiki API plaintext for `titles`
#   events     structured event feed handled by events.py (`parser` selects which)
# fetch: live | wayback | auto   (auto = live, Wayback Machine on 403/404/410)
# allow / deny: regexes matched against the absolute URL (allow defaults to same-domain)

defaults:
  max_depth: 2
  max_pages: 150
  fetch: auto
  follow_pdfs: false
  deny:
    - '\.(jpg|jpeg|png|gif|svg|webp|avif|mp4|mp3|zip|ics|css|js|xml)(\?|$)'
    - '[?&](oc_lang|share|replytocom|print|format|tribe-bar-date|ical)='
    - '/(login|signin|sign-in|account|cart|checkout|wp-admin|wp-login|feed|tag|author)/'
    - '/(page|p)/\d{2,}'       # deep pagination
    - '\?.*(sort|filter|view)='

