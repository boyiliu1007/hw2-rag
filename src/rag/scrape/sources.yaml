  # ---------------- Gap fill: college athletics ----------------
  - name: college_athletics
    fetch: auto   # PrestoSports sites (CMU, Carlow) answer scripts with a 202 bot challenge
    topic: sports
    type: crawl
    seeds:
      - https://rmucolonials.com/
      - https://rmucolonials.com/sports/football/schedule
      - https://rmucolonials.com/sports/mens-basketball/schedule
      - https://goduquesne.com/
      - https://goduquesne.com/sports/football/schedule
      - https://goduquesne.com/sports/mens-basketball/schedule
      - https://pittsburghpanthers.com/
      - https://gochathamcougars.com/
      - https://pointparksports.com/
      - https://athletics.cmu.edu/
      - https://athletics.carlow.edu/
    allow:   # Sidearm sites (schedule/roster pages per sport) and PrestoSports sites (season pages)
      - '^https?://(www\.)?(rmucolonials|goduquesne|pittsburghpanthers|gochathamcougars|pointparksports)\.com/(sports/[^/]+/(schedule|roster|coaches)(/20\d\d(-\d\d)?)?$|staff-directory|sports/[^/]+/?$|sports/[^/]+/(history|records))'
      - '^https?://(athletics\.cmu\.edu|athletics\.carlow\.edu)/(landing/index|sports/[^/]+/(index|20\d\d-\d\d/(schedule|roster|coaches))|sports/[^/]+/?$)'
    # Sidearm builds its sport menus with JavaScript; its sitemaps list every schedule/roster page
    sitemaps:
      - https://admin.pittsburghpanthers.com/sitemap.xml
      - https://rmucolonials.com/sitemap.xml
      - https://goduquesne.com/sitemap.xml
    sitemap_index_filter: 'sitemap_(schedule|roster)_'
    sitemap_filter: '/sports/[^/]+/(schedule|roster)/(2026|2026-27|2027)$'
    deny: ['/(print|ical|stats|news)/', '/(schedule|roster)/20(0\d|1\d|2[0-5])', '/roster/(coaches|staff)/', '/roster/[^/]+/\d+']
    max_depth: 2
