      - {name: Museums in Pittsburgh, depth: 1}
      - {name: Bridges in Pittsburgh}
      - {name: Neighborhoods in Pittsburgh}
      - {name: Downtown Pittsburgh}
      - {name: Universities and colleges in Pittsburgh}
      - {name: Carnegie Mellon University}
      - {name: Sports venues in Pittsburgh, depth: 1}
      - {name: Festivals in Pittsburgh}
      - {name: Parks in Pittsburgh, depth: 1}
      - {name: Theatres in Pittsburgh}
      - {name: Music venues in Pittsburgh}
      - {name: Culture of Pittsburgh}
      - {name: History of Pittsburgh}
      - {name: Buildings and structures in Pittsburgh}
      - {name: Tourist attractions in Pittsburgh}
      - {name: Companies based in Pittsburgh, limit: 120}
      - {name: Robert Morris Colonials, depth: 1}
      - {name: Duquesne Dukes, depth: 1}
      - {name: Mayors of Pittsburgh}
      - {name: Streets in Pittsburgh}
      - {name: National Register of Historic Places in Pittsburgh}
      - {name: City of Pittsburgh historic designations}
      - {name: Historic districts in Pittsburgh}
    players: true   # current-roster articles, names from datasets.py (sports)
    # Articles linked from the hand-picked `titles` above whose (visible) Wikipedia categories
    # mention the region; lead section only, so the long tail adds breadth, not bulk.
    linked:
      category_pattern: 'Pittsburgh|Allegheny County|Carnegie Mellon'
      max: 5000
    delay: 2.0      # Wikimedia rate-limits anonymous API clients sharing an IP

  # ---------------- Structured datasets / APIs (datasets.py) ----------------
  - name: cmoa
    topic: culture
    type: dataset
    parser: cmoa
    # Carnegie Museum of Art open collection data (CC0, 2017 release). The museum removed
    # github.com/cmoa/collection; this is an unmodified fork of it.
    url: https://raw.githubusercontent.com/roll/collection/master/cmoa.csv

  - name: millage
    topic: general
    type: dataset
    parser: millage
    years: [2026, 2025]

  - name: sports
    topic: sports
    type: dataset
    parser: sports
    nhl_season: '20262027'
    espn_teams:   # ESPN site API schedules; seasons are ESPN's season labels
      - {name: Pittsburgh Steelers, id: 23, sport: football/nfl, league: NFL, seasons: [2026]}
      - {name: Pittsburgh Panthers football, id: 221, sport: football/college-football, league: college football, seasons: [2026]}
      - {name: Duquesne Dukes football, id: 2184, sport: football/college-football, league: college football, seasons: [2026]}
      - {name: Robert Morris Colonials football, id: 2523, sport: football/college-football, league: college football, seasons: [2026]}
      - {name: Pittsburgh Panthers men's basketball, id: 221, sport: basketball/mens-college-basketball, league: men's college basketball, seasons: [2027]}
      - {name: Duquesne Dukes men's basketball, id: 2184, sport: basketball/mens-college-basketball, league: men's college basketball, seasons: [2027]}
      - {name: Robert Morris Colonials men's basketball, id: 2523, sport: basketball/mens-college-basketball, league: men's college basketball, seasons: [2027]}
    espn_rosters:
      - {name: Pittsburgh Steelers, id: 23, sport: football/nfl, wiki_hint: American football}

  - name: osm
    topic: places
    type: dataset
    parser: osm
    # every named place of these kinds in Allegheny County (OpenStreetMap, ODbL)
    area: Allegheny County
    admin_level: 6
    filters:
      shop: "."
      amenity: "^(restaurant|cafe|bar|pub|fast_food|ice_cream|biergarten|theatre|cinema|arts_centre|nightclub|library|marketplace|events_venue|community_centre|music_venue)$"
      tourism: "^(museum|gallery|attraction|hotel|zoo|theme_park|viewpoint|artwork)$"
      leisure: "^(park|stadium|sports_centre|garden|nature_reserve|bowling_alley|escape_game|amusement_arcade)$"

  - name: britannica
    topic: general
    type: crawl
    fetch: wayback
    seeds: [https://www.britannica.com/place/Pittsburgh]
    max_depth: 0

  - name: pittsburghpa_gov
